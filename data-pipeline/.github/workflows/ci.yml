# 정적 검사 — PR 과 dev push 에서 돌고, 배포 워크플로(deploy.yml)도 배포 전에 이걸 부른다.
#
# 테스트 스위트가 없다. 여기서 하는 건 "테스트"가 아니라 수집 EC2 에서 스케줄러가
# 기동조차 못 하는 종류의 실수를 막는 검사다:
#   - requirements.txt 로 새로 설치했을 때 스케줄러·도메인 모듈이 import 되는가
#   - 스케줄 표가 만들어지는가(--dry-run: 일정만 출력하고 종료, API·DB 호출 없음)
name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
      # 일부 수집기는 import 시점에 키가 없으면 멈춘다(portmis_collector, vessel_spec_collector).
      # 호출하지 않으니 더미 값이면 충분하다. DB 도 붙지 않는다.
      PORT_MIS_API_KEY: ci-dummy
      UPA_SERVICE_KEY: ci-dummy
      KHOA_API_KEY: ci-dummy
      KMA_API_KEY: ci-dummy
      KMA_BUOY_AUTH_KEY: ci-dummy
      MMAF_API_KEY: ci-dummy
      KOSHA_MSDS_API_KEY: ci-dummy
    steps:
      - uses: actions/checkout@v4

      # 로컬 개발 venv 와 같은 3.10. 수집 EC2 도 같은 버전을 쓴다(deploy/README.md).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 문법 검사
        run: python -m compileall -q data_pipeline

      - name: 스케줄러 경로 import
        # 도메인 함수들은 실행 시점에 import 하므로(run_pipeline 안의 지연 import) 여기서 직접 부른다.
        run: |
          python - <<'EOF'
          import importlib
          for m in [
              "data_pipeline.pipeline_scheduler", "data_pipeline.run_pipeline",
              "data_pipeline.raw_cleanup", "data_pipeline.common_pg_loader",
              "data_pipeline.upa.upa_collector", "data_pipeline.upa.upa_preprocess",
              "data_pipeline.upa.upa_loader",
          ]:
              importlib.import_module(m)
          import pkgutil, data_pipeline.collectors as c, data_pipeline.preprocessors as p, data_pipeline.loaders as l
          # 스케줄러가 부르지 않는 수동 실행 모듈 — import 시점에 DB·Neo4j·AIS 접속정보를
          # 요구해서 더미 환경에서는 멈춘다. 수집 EC2 운영 경로와 무관하다.
          MANUAL = {
              "ais_collector",                   # 레거시 AIS(LEGACY_DOMAINS)
              "berth_neo4j_loader", "bulk_compatibility_neo4j_loader",
              "cargo_category_loader", "imdg_segregation_loader",
              "msds_neo4j_loader", "msds_pg_loader",
          }
          for pkg in (c, p, l):
              for mod in pkgutil.iter_modules(pkg.__path__):
                  if mod.name in MANUAL:
                      continue
                  importlib.import_module(f"{pkg.__name__}.{mod.name}")
          print("import ok")
          EOF

      - name: 스케줄 표 (--dry-run)
        run: python -m data_pipeline.pipeline_scheduler --dry-run

      - name: 배포 스크립트 문법
        run: bash -n deploy/deploy.sh
