# 로컬 개발 인프라 — PostgreSQL(5433) · Neo4j.  실행: docker compose -f docker-compose.dev.yml up -d
# 계정 값(${...})은 같은 폴더의 .env 에서 읽는다(compose 기본 동작).
#
# 계정 값은 **볼륨이 처음 만들어질 때만** 적용된다. 이미 있는 볼륨은 그때의 계정을 그대로
# 쓰므로, 여기 값을 바꿔도 기존 DB 비밀번호는 바뀌지 않는다.

# 프로젝트 이름 고정 — 볼륨 이름이 여기서 정해진다(smart-port-multi-agent_postgres_data 등).
# 이 파일은 원래 워크스페이스 루트에 있어서 폴더명으로 이 이름이 붙었고, 로컬 DB 데이터가
# 그 볼륨에 있다(2026-07-03 생성). 고정하지 않으면 backend/ 에서 실행할 때 프로젝트가
# "backend" 가 되어 backend_postgres_data 라는 **다른 볼륨**에 붙는다 — 그 이름의 볼륨이
# 다른 프로젝트 것으로 이미 있을 수 있다(2026-09-24 이 PC 실측: backend_mysql_data 등과 함께 존재).
name: smart-port-multi-agent

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: smartport-postgres-dev
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  neo4j:
    image: neo4j:5.26-community
    container_name: smartport-neo4j-dev
    environment:
      # 사용자 이름은 반드시 neo4j, 비밀번호에 '/' 불가, 비밀번호 'neo4j' 불가 — 아니면 이미지
      # 엔트리포인트가 기동을 거부한다(데이터가 이미 있어도 매 기동 검사. /startup/docker-entrypoint.sh).
      NEO4J_AUTH: ${NEO4J_USER}/${NEO4J_PASSWORD}
      NEO4J_PLUGINS: '["apoc"]'
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data

volumes:
  postgres_data:
  neo4j_data:
